# ------------------------------------------------------------------------------
# Camera Positioning
# ------------------------------------------------------------------------------
positioning:
  # Shared by the front, rear, left, and right positions.
  # Distance from the player in meters.
  # Default: 3.0 | Min: 1.0 | Max: 20.0
  minimum_distance: 3.0
  # Default: 8.0 | Min: 2.0 | Max: 30.0
  maximum_distance: 8.0
  # Height above terrain, blended by distance.
  # Default: 2.0 | Min: 0.5 | Max: 10.0
  minimum_height: 2.0
  # Default: 8.0 | Min: 1.0 | Max: 20.0
  maximum_height: 8.0
  # Maximum random horizontal angle offset around the selected direction.
  # Default: 25.0 | Min: 0.0 | Max: 45.0
  angle_variation: 25.0

# Dynamic catch-up and braking based on player's acceleration
catch_up:
  # Maximum extra catch-up speed (in m/s) granted when the camera falls behind
  # Default: 2.0 | Min: 0.0 | Max: 10.0
  # * High: Camera can close a positioning gap faster.
  # * Low: Camera has little extra speed to close a positioning gap.
  max_bonus: 2.0

  # Upper bound on camera speed relative to the host-provided maxSpeed.
  # Default: 1.5 times maxSpeed
  # * High: More speed is available to close a large gap.
  # * Low: The camera cannot exceed the target's reference speed by much.
  maximum_speed_multiplier: 1.5

  # Default: 0.5 (m/s per meter of position error). Builds catch-up speed.
  position_error_speed_gain: 0.5
  # Dynamic acceleration response (gain) to close the gap if the camera is left behind
  # Default: 3.0 | Min: 0.5 | Max: 10.0
  # * High: Lightning-fast acceleration to catch up (high reactivity, but risk of sudden speed jumps).
  # * Low: Majestic and slow acceleration to close the gap (very smooth, but risk of prolonged lag).
  speed_response: 3.0

  # Dynamic braking response (gain) to prevent overshooting the player on sudden stops
  # Default: 9.0 | Min: 1.0 | Max: 20.0
  # * High: Powerful and instant emergency braking on player stops (framing safety, rigid look).
  # * Low: Smooth and gradual braking (camera gracefully overshoots player by inertia before backing up).
  brake_response: 9.0

# Reactive Obstacle and Terrain Avoidance System (Trajectory Planner)
# Algos used: Predictive Raycasting (SphereCasts) + asymmetric terrain following
# Raycasting to predict and bypass physical obstacles (trees, rocks, structures)
obstacle_avoidance:
  # Recalculation interval for obstacle avoidance raycasts (in seconds)
  # Default: 0.1 | Min: 0.02 | Max: 1.0
  # * High: Fewer avoidance calculations (saves CPU), but delayed bypass reaction.
  # * Low: Ultra-reactive real-time obstacle avoidance (constant SphereCasts, CPU impact).
  refresh_interval: 0.1

  # Minimum safety look-ahead distance (in meters) projected in front of the camera
  # Default: 4.0 | Min: 1.0 | Max: 15.0
  # * High: Very early detection of obstacles (camera initiates bypass very early and smoothly).
  # * Low: Delayed reaction (camera bypasses obstacle at the last moment with a sharp turn).
  minimum_look_ahead: 4.0

  # Anticipation time (in seconds) used to extend detection distance based on current camera speed
  # Default: 2.0 | Min: 0.5 | Max: 5.0
  # * High: Greatly increases warning distance at high speeds.
  # * Low: Avoidance distance has little correlation with camera speed.
  look_ahead_seconds: 2.0

  # Radius of the camera's virtual sphere (in meters) tested during SphereCasts for physical collisions
  # Default: 0.35 | Min: 0.05 | Max: 2.0
  # * High: Immense safety bubble (avoids brushing the smallest leaf, but can lock up in narrow pathways).
  # * Low: Tight bubble (squeezes through narrow gaps, but risk of visible visual intersections with decor).
  camera_radius: 0.35

  # Fallback retreat distance (in meters) when an actor blocks the route and no detour is clear
  # Default: 2.0 | Min: 0.5 | Max: 10.0
  # * High: Camera retreats farther when no route around an actor is clear.
  # * Low: Fallback retreat is shorter; this is not a standing safety distance.
  actor_retreat_distance: 2.0

  # Default: 2.5 m. Nearby obstacles allow emergency steering limits.
  emergency_distance: 2.5
  # Default: 0.04 (m/s)^2. Below this squared speed, ignore momentum.
  momentum_speed_squared: 0.04
  # Candidate offsets [sideways meters, upward meters], in search order.
  # Default: test near left/right before wider or higher alternatives.
  route_offsets:
    - [-1.0, 0.0]
    - [1.0, 0.0]
    - [-1.0, 1.0]
    - [1.0, 1.0]
    - [-2.0, 1.0]
    - [2.0, 1.0]
    - [-1.0, 2.0]
    - [1.0, 2.0]
    - [0.0, 1.0]
    - [0.0, 2.0]
  # Default: 2.0 s. Keeps the chosen avoidance side after a clear path.
  avoidance_side_hold: 2.0

# Damping and time constants for terrain slope following
terrain_following:
  # Camera speed at which full terrain clearance is applied.
  # Default: 3.0 | Min: 0.5 | Max: 10.0
  full_clearance_speed: 3.0

  # Minimum movement height above the ground, in meters.
  # Default: 2.0 | Min: 0.5 | Max: 10.0
  # * High: Safe, high survol movement (overall aerial view).
  # * Low: Extremely low and cinematic rasant movement (risk of clipping rough terrain).
  minimum_height: 2.0

  # Safety height (ground clearance margin in meters) preserved at slow speeds to avoid rough terrain
  # Default: 1.5 | Min: 0.5 | Max: 5.0
  # * High: Comfortable ground clearance ensured even when stopped.
  # * Low: Camera drops very low to the player's eye level when stopped.
  slow_clearance: 1.5

  # Damping time constant (in seconds) for fast climbing when facing an obstacle or slope
  # Default: 0.35 | Min: 0.05 | Max: 2.0
  # * High: Slow and lazy climb (high risk of hitting a steep hill).
  # * Low: Instant and vigorous climbing reaction (maximum protection against terrain).
  rise_smooth_time: 0.35

  # Damping time constant (in seconds) for slow and smooth descent after passing a summit
  # Default: 1.5 | Min: 0.2 | Max: 5.0
  # * High: Majestic and damped descent (completely eliminates vertical hover-bobbing/oscillations).
  # * Low: Camera dives immediately after a summit (unpleasant rollercoaster effect).
  fall_smooth_time: 1.5

  # Number of ground-height samples along the future trajectory to plan smooth elevation
  # Default: 8 | Min: 2 | Max: 24
  # * High: Perfect and anticipated tracking of the smallest bumps in the ground.
  # * Low: Coarse ground tracking (may react with a delay to a dirt mound).
  samples: 8

# ------------------------------------------------------------------------------
# Kinematic Solver and Physical Engine (Camera Motion)
# ------------------------------------------------------------------------------
# Physical principles: 3rd-order S-curve motion profile (Jerk Limiting / S-Curve) + vertical damping (SmoothDamp)
motion:
  # Acceleration and jerk ceilings (horizontal and vertical)
  limits:
    # Maximum horizontal acceleration (in m/s²) allowed during standard smooth movement
    # Default: 14.0 | Min: 1.0 | Max: 30.0
    # * High: Camera accelerates vividly and twitchily (maximum reactivity).
    # * Low: Heavy and slow acceleration (camera feels very heavy, increases reaction time).
    maximum_acceleration: 14.0

    # Maximum horizontal jerk (m/s³) - Acceleration rate change limit (determines organic inertia and fluidity)
    # Default: 60.0 | Min: 5.0 | Max: 120.0
    # * High: Sharp and mechanical speed changes (rigid/robotic look).
    # * Low: Extremely smoothed and progressive organic inertia (crane or Steadicam effect).
    maximum_jerk: 60.0

    # Maximum horizontal emergency acceleration (in m/s²) during sudden collision bypasses
    # Default: 22.0 | Min: 5.0 | Max: 50.0
    # * High: Extremely vigorous and fast emergency avoidance to dodge physical obstacles.
    # * Low: Lazy emergency avoidance (high risk of colliding before having time to brake).
    emergency_acceleration: 22.0

    # Maximum emergency jerk (m/s³) during critical collision avoidance
    # Default: 100.0 | Min: 10.0 | Max: 250.0
    # * High: Sharp and instant emergency direction changes to flee danger.
    # * Low: Smooth and damped emergency direction changes (may lack reactivity against fine obstacles).
    emergency_jerk: 100.0

    # Maximum allowed vertical acceleration (in m/s²)
    # Default: 5.0 | Min: 0.5 | Max: 10.0
    # * High: Instant and energetic compensation of ground elevation or slope changes.
    # * Low: Very smooth vertical climbing/falling (risk of hitting ground during sudden slope changes).
    maximum_vertical_acceleration: 5.0

  # Kinematic damping time constants (convergence gains)
  response_times:
    # Velocity solver response time (in seconds) to reach target nominal kinematic velocity
    # Default: 0.15 | Min: 0.05 | Max: 2.0
    # * High: Significant lag relative to target speed (lazy movement).
    # * Low: Camera reaches target speed almost instantaneously (very direct movement).
    velocity_response_time: 0.15

    # Emergency avoidance response time (in seconds) when facing imminent obstacle
    # Default: 0.1 | Min: 0.02 | Max: 1.0
    # * High: Delay in triggering backup escape trajectory (collision danger).
    # * Low: Immediate emergency pivot as soon as an obstacle cuts the alert zone.
    emergency_response_time: 0.1

    # Damping time (in seconds) to smooth vertical position adjustment transitions
    # Default: 0.45 | Min: 0.1 | Max: 5.0
    # * High: Extremely long and soft altitude damping (majestic gliding movement).
    # * Low: Sharp altitude adjustments without inertia (maximum reactivity to ground bumps).
    vertical_smooth_time: 0.45

    # Estimated time (in seconds) to converge horizontally to target destination waypoint
    # Default: 0.6 | Min: 0.1 | Max: 5.0
    # * High: Very smooth and progressive convergence towards target (perfect for cinema).
    # * Low: Camera charges in straight line and stops dead on target.
    horizontal_arrival_time: 0.6

  # Vertical climbing and falling speeds
  vertical_movement:
    # Standard vertical speed in m/s for small height adjustments.
    # Default: 1.2 | Min: 0.1 | Max: 5.0
    # * High: Faster climbing and descending during normal movement.
    # * Low: Slower and smoother height adjustments.
    normal_speed: 1.2

    # Maximum vertical speed in m/s for large height differences.
    # Default: 4.0 | Min: 0.5 | Max: 8.0
    # * High: Large height differences are corrected quickly.
    # * Low: Large height differences take longer to correct.
    maximum_speed: 4.0

    # Height-error range that blends normal speed into maximum speed.
    # Default: 2.0 m. Below this error, use normal speed.
    maximum_speed_error_start: 2.0
    # Default: 10.0 m. Beyond this error, allow maximum speed.
    maximum_speed_error_end: 10.0

# ------------------------------------------------------------------------------
# Camera Orientation and Aiming (Camera Look)
# ------------------------------------------------------------------------------
# Main Algo: Critically damped angular spring-damper (Mathf.SmoothDampAngle) towards the target
aiming:
  # Height above the target origin used as the camera's point of interest.
  # Default: 1.6 | Min: 0.0 | Max: 5.0
  target_height: 1.6

  # Angular smoothing and vertical angle limits of camera towards the target
  # Damping time (in seconds) applied to look target damping (Pitch/Yaw) to track player
  # Default: 0.3 | Min: 0.1 | Max: 5.0
  # * High: Very damped and slow camera tracking (mimics a human cameraman handling a heavy camera).
  # * Low: Robotic, immediate, and rigid lock on target (zero delay, mechanical look).
  rotation_smooth_time: 0.3

  # Maximum pan rotation speed of the camera (in degrees/second)
  # Default: 120.0 | Min: 5.0 | Max: 180.0
  # * High: Lightning-fast pan rotation if player passes by suddenly.
  # * Low: Capped rotation speed (player may temporarily exit framing during sudden movements).
  maximum_rotation_speed: 120.0

  # Maximum vertical tilt angle (Pitch) of camera looking up or down (in degrees)
  # Default: 70.0 | Min: 10.0 | Max: 90.0
  # * High: Allows very pronounced plunging and high-angle tilt views.
  # * Low: Keeps look angle close to horizon line (prevents distorted perspectives).
  maximum_pitch_angle: 70.0

# ------------------------------------------------------------------------------
# Recovery Framing (Camera Framing)
# ------------------------------------------------------------------------------
recovery:
  # Safe backup target if camera loses sight of player
  # Horizontal replacement distance (in meters) relative to player if framing is lost
  # Default: 4.0 | Min: 1.0 | Max: 15.0
  # * High: Backup target lies far behind player (wide escape framing).
  # * Low: Backup target very close behind player's back (tight escape framing).
  distance: 4.0

  # Backup recovery height (in meters) relative to player if visibility is lost
  # Default: 2.0 | Min: 0.5 | Max: 10.0
  # * High: Backup target climbs high above player (escape overlook).
  # * Low: Backup target close to ground level.
  height: 2.0

  # Comfortable pitch angle (in degrees) used to calculate the recovery distance
  # Default: 55.0 | Min: 10.0 | Max: 90.0
  # * High: Shorter recovery distance is accepted for the same camera height.
  # * Low: A greater recovery distance is required for the same camera height.
  comfortable_pitch: 55.0
